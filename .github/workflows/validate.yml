name: Validate skills

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate skill folders and README links
        run: python tools/validate_skills.py

      - name: Check public safety scanner for blocking findings
        run: python tools/check_public_safety.py

      - name: Check local Markdown links
        run: python tools/check_markdown_links.py

      - name: List skills with installer
        shell: pwsh
        run: ./install.ps1 -List

      - name: Smoke-test one skill install
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "jqai-skills"
          ./install.ps1 release-announcement-writer -Target $target
          if (-not (Test-Path (Join-Path $target "release-announcement-writer/SKILL.md"))) {
            throw "release-announcement-writer did not install correctly"
          }

  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test-only image dependency
        run: python -m pip install "Pillow>=12,<13"
      - name: Enable mandatory Linux synthetic video coverage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Run offline synthetic regressions
        run: python -X utf8 -B -m unittest discover -s tests -p "test_*.py" -v
      - name: Test collector with mocked sources only
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/test_windows_collector.ps1
      - name: Test installer with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $target = Join-Path $env:RUNNER_TEMP ("installer-51-" + [guid]::NewGuid())
          ./install.ps1 backup-readiness-auditor -Target $target -DryRun
          if (Test-Path $target) { throw "Dry run wrote files" }
          ./install.ps1 backup-readiness-auditor -Target $target
          ./install.ps1 backup-readiness-auditor -Target $target
          if (-not (Test-Path (Join-Path $target "backup-readiness-auditor/.jqai-install.json"))) { throw "Missing receipt" }
      - name: Smoke-test changed skill installs in a new temporary target
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP ("skills-smoke-" + [guid]::NewGuid())
          $names = @("backup-readiness-auditor", "github-safe-publisher", "skill-builder", "agents-md-writer", "media-spec-checker", "automation-state-reconciler", "windows-reinstall-planner", "research-to-article", "remove-ai-image-metadata")
          foreach ($name in $names) {
            ./install.ps1 $name -Target $target
            if (-not (Test-Path (Join-Path $target "$name/SKILL.md"))) { throw "Missing installed skill: $name" }
          }
